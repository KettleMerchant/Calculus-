<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Differential Calculus Rules</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1c2128;
      --border: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent: #58a6ff;
      --accent-dim: rgba(88, 166, 255, 0.15);
      --success: #3fb950;
      --success-dim: rgba(63, 185, 80, 0.15);
      --danger: #f85149;
      --danger-dim: rgba(248, 81, 73, 0.15);
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 500;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .formula-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin: 12px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 20px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .description {
      color: var(--text-secondary);
      font-size: 15px;
      margin-top: 8px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .step:last-child { border-bottom: none; }

    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .step-body {
      flex: 1;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .step-body strong {
      color: var(--text-primary);
      font-weight: 500;
    }

    .example-func {
      font-size: 22px;
      text-align: center;
      margin: 8px 0 16px;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    .reveal-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .reveal-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hidden { display: none !important; }

    .practice-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 16px;
      margin-top: 10px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .practice-input:focus { border-color: var(--accent); }

    .practice-input::placeholder { color: var(--text-muted); }

    .btn-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
    }

    .check-btn {
      padding: 8px 18px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      transition: opacity 0.15s ease;
    }

    .check-btn:hover { opacity: 0.85; }

    .hint-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      padding: 0;
    }

    .hint-btn:hover { color: var(--text-secondary); }

    .hint-text {
      margin-top: 10px;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--text-secondary);
      display: none;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    .feedback.correct {
      background: var(--success-dim);
      color: var(--success);
      display: block;
    }

    .feedback.wrong {
      background: var(--danger-dim);
      color: var(--danger);
      display: block;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      .container { padding: 20px 16px; }
      header h1 { font-size: 24px; }
      .formula-box { font-size: 16px; padding: 16px; }
      .example-func { font-size: 18px; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Differential Calculus Rules</h1>
      <p>Learn, practice, and master the rules of differentiation</p>
    </header>

    <nav class="tabs" id="tab-bar"></nav>
    <main id="content-area"></main>

    <footer>
      Built for GitHub Pages &middot; No external dependencies
    </footer>
  </div>

  <script>
    const rules = {
      power: {
        name: "Power rule",
        formula: "d/dx [xⁿ] = n·xⁿ⁻¹",
        desc: "When differentiating x raised to a power n, bring the exponent down as a coefficient and subtract 1 from the exponent.",
        steps: [
          { text: "Identify the exponent <strong>n</strong> on the variable x." },
          { text: "Multiply the term by <strong>n</strong> (bring the exponent to the front)." },
          { text: "Decrease the exponent by <strong>1</strong>." }
        ],
        example: { f: "f(x) = x⁵", steps: [
          "The exponent is n = 5",
          "Bring 5 to the front: 5·x⁵",
          "Subtract 1 from the exponent: 5·x⁴",
          "Therefore, f'(x) = 5x⁴"
        ]},
        practice: { q: "Differentiate f(x) = x⁷", a: ["7x^6", "7*x^6", "7x⁶"], hint: "Bring the 7 down and subtract 1 from the exponent." }
      },
      constant: {
        name: "Constant rule",
        formula: "d/dx [c] = 0",
        desc: "The derivative of any constant is zero. Constants don't change, so their rate of change is zero.",
        steps: [
          { text: "Recognize that the term is a constant (no x variable)." },
          { text: "The derivative of any constant is <strong>0</strong>." }
        ],
        example: { f: "f(x) = 12", steps: [
          "12 is a constant — it has no x variable",
          "The derivative of a constant is always 0",
          "Therefore, f'(x) = 0"
        ]},
        practice: { q: "Differentiate f(x) = -3", a: ["0"], hint: "There is no x variable, so the rate of change is zero." }
      },
      constant_multiple: {
        name: "Constant multiple",
        formula: "d/dx [c·f(x)] = c·f'(x)",
        desc: "A constant coefficient stays unchanged while you differentiate the function it multiplies.",
        steps: [
          { text: "Identify the constant coefficient <strong>c</strong>." },
          { text: "Differentiate the function <strong>f(x)</strong> as usual." },
          { text: "Multiply the result by <strong>c</strong>." }
        ],
        example: { f: "f(x) = 4x³", steps: [
          "The constant coefficient is c = 4",
          "Differentiate x³ using the power rule: 3x²",
          "Multiply by 4: 4 · 3x² = 12x²",
          "Therefore, f'(x) = 12x²"
        ]},
        practice: { q: "Differentiate f(x) = 5x⁴", a: ["20x^3", "20*x^3", "20x³"], hint: "Keep the 5, differentiate x⁴ to get 4x³, then multiply: 5 × 4x³." }
      },
      sum: {
        name: "Sum & difference",
        formula: "d/dx [f(x) ± g(x)] = f'(x) ± g'(x)",
        desc: "The derivative of a sum or difference is the sum or difference of the derivatives. Differentiate each term separately.",
        steps: [
          { text: "Break the expression into individual terms." },
          { text: "Differentiate each term separately using the appropriate rule." },
          { text: "Combine the results with the same signs (+ or −)." }
        ],
        example: { f: "f(x) = 3x² + 5x − 7", steps: [
          "Break into terms: 3x², 5x, and −7",
          "d/dx[3x²] = 3 · 2x = 6x",
          "d/dx[5x] = 5 · 1 = 5",
          "d/dx[−7] = 0",
          "Therefore, f'(x) = 6x + 5"
        ]},
        practice: { q: "Differentiate f(x) = 2x³ + 4x² − x", a: ["6x^2+8x-1", "6x²+8x-1", "6x^2 + 8x - 1", "6x² + 8x − 1"], hint: "Differentiate each term: 2x³ → 6x², 4x² → 8x, −x → −1." }
      },
      product: {
        name: "Product rule",
        formula: "d/dx [f·g] = f'·g + f·g'",
        desc: "When two functions are multiplied together, the derivative is: derivative of the first times the second, plus the first times derivative of the second.",
        steps: [
          { text: "Identify the two functions being multiplied: <strong>f(x)</strong> and <strong>g(x)</strong>." },
          { text: "Find <strong>f'(x)</strong> and <strong>g'(x)</strong> separately." },
          { text: "Apply the formula: <strong>f'·g + f·g'</strong>." }
        ],
        example: { f: "f(x) = x² · eˣ", steps: [
          "Let u = x² and v = eˣ",
          "u' = 2x and v' = eˣ",
          "Apply product rule: u'v + uv' = 2x·eˣ + x²·eˣ",
          "Factor: eˣ(2x + x²)",
          "Therefore, f'(x) = eˣ(x² + 2x)"
        ]},
        practice: { q: "Differentiate f(x) = x³ · sin(x)", a: ["3x^2*sin(x)+x^3*cos(x)", "3x²sin(x)+x³cos(x)", "x^3*cos(x)+3x^2*sin(x)", "x³cos(x)+3x²sin(x)"], hint: "f = x³, g = sin(x). f' = 3x², g' = cos(x). Use f'g + fg'." }
      },
      quotient: {
        name: "Quotient rule",
        formula: "d/dx [f/g] = (f'·g − f·g') / g²",
        desc: "For a function divided by another function: bottom times derivative of top, minus top times derivative of bottom, over bottom squared.",
        steps: [
          { text: "Identify <strong>f(x)</strong> (top) and <strong>g(x)</strong> (bottom)." },
          { text: "Find <strong>f'(x)</strong> and <strong>g'(x)</strong>." },
          { text: "Apply: <strong>(f'·g − f·g') / g²</strong>." }
        ],
        example: { f: "f(x) = x² / (x + 1)", steps: [
          "Top: u = x² → u' = 2x",
          "Bottom: v = x + 1 → v' = 1",
          "Apply formula: (u'v − uv') / v² = (2x(x+1) − x²·1) / (x+1)²",
          "Simplify numerator: 2x² + 2x − x² = x² + 2x",
          "Therefore, f'(x) = (x² + 2x) / (x + 1)²"
        ]},
        practice: { q: "Differentiate f(x) = (3x) / (x² + 1)", a: ["(3-3x^2)/(x^2+1)^2", "(3-3x²)/(x²+1)²", "3(1-x^2)/(x^2+1)^2", "−3(x^2-1)/(x^2+1)^2"], hint: "Top: 3x → 3. Bottom: x²+1 → 2x. Use (f'g − fg')/g²." }
      },
      chain: {
        name: "Chain rule",
        formula: "d/dx [f(g(x))] = f'(g(x)) · g'(x)",
        desc: "For composite functions (a function inside another function): differentiate the outer function, keeping the inner function unchanged, then multiply by the derivative of the inner function.",
        steps: [
          { text: "Identify the <strong>outer function</strong> f and the <strong>inner function</strong> g." },
          { text: "Differentiate the outer function <strong>f</strong>, leaving the inner function <strong>g(x)</strong> inside." },
          { text: "Multiply by the derivative of the inner function <strong>g'(x)</strong>." }
        ],
        example: { f: "f(x) = (3x + 2)⁵", steps: [
          "Outer: u⁵ → derivative is 5u⁴",
          "Inner: u = 3x + 2 → derivative is 3",
          "Apply chain rule: 5(3x+2)⁴ · 3",
          "Therefore, f'(x) = 15(3x + 2)⁴"
        ]},
        practice: { q: "Differentiate f(x) = (x² + 1)³", a: ["6x(x^2+1)^2", "6x(x²+1)²", "3(x^2+1)^2*2x"], hint: "Outer: u³ → 3u². Inner: x²+1 → 2x. Multiply: 3(x²+1)² · 2x." }
      },
      exponential: {
        name: "Exponential",
        formula: "d/dx [eˣ] = eˣ &nbsp; d/dx [aˣ] = aˣ·ln(a)",
        desc: "The exponential function eˣ is its own derivative. For other bases aˣ, multiply by the natural log of the base.",
        steps: [
          { text: "If the base is <strong>e</strong>, the derivative is unchanged: eˣ." },
          { text: "If the base is <strong>a</strong>, the derivative is aˣ·ln(a)." },
          { text: "If the exponent is a function of x, also apply the <strong>chain rule</strong>." }
        ],
        example: { f: "f(x) = e³ˣ", steps: [
          "The base is e, so the derivative of e^u is e^u",
          "The exponent is u = 3x, so u' = 3",
          "Apply chain rule: e³ˣ · 3",
          "Therefore, f'(x) = 3e³ˣ"
        ]},
        practice: { q: "Differentiate f(x) = 2ˣ", a: ["2^x*ln(2)", "2ˣln(2)", "ln(2)*2^x"], hint: "For aˣ, the derivative is aˣ·ln(a). Here a = 2." }
      },
      logarithmic: {
        name: "Logarithmic",
        formula: "d/dx [ln(x)] = 1/x &nbsp; d/dx [logₐ(x)] = 1/(x·ln(a))",
        desc: "The derivative of the natural logarithm is 1/x. For other log bases, divide by x·ln(a).",
        steps: [
          { text: "For <strong>ln(x)</strong>, the derivative is simply <strong>1/x</strong>." },
          { text: "For <strong>logₐ(x)</strong>, the derivative is <strong>1/(x·ln(a))</strong>." },
          { text: "If the argument is a function of x, apply the <strong>chain rule</strong>." }
        ],
        example: { f: "f(x) = ln(x² + 1)", steps: [
          "The outer function is ln(u), derivative is 1/u",
          "The inner function is u = x² + 1, derivative is 2x",
          "Apply chain rule: (1/(x²+1)) · 2x",
          "Therefore, f'(x) = 2x/(x² + 1)"
        ]},
        practice: { q: "Differentiate f(x) = ln(5x)", a: ["1/x", "5/(5x)"], hint: "ln(5x) = ln(5) + ln(x). Or use chain rule: 1/(5x) · 5 = 1/x." }
      },
      trig: {
        name: "Trigonometric",
        formula: "d/dx[sin x]=cos x &nbsp; d/dx[cos x]=−sin x &nbsp; d/dx[tan x]=sec²x",
        desc: "Memorize the basic trig derivatives. Sine becomes cosine, cosine becomes negative sine, tangent becomes secant squared.",
        steps: [
          { text: "<strong>sin(x)</strong> → cos(x)" },
          { text: "<strong>cos(x)</strong> → −sin(x) (note the negative sign!)" },
          { text: "<strong>tan(x)</strong> → sec²(x)" }
        ],
        example: { f: "f(x) = sin(2x)", steps: [
          "The outer function is sin(u), derivative is cos(u)",
          "The inner function is u = 2x, derivative is 2",
          "Apply chain rule: cos(2x) · 2",
          "Therefore, f'(x) = 2cos(2x)"
        ]},
        practice: { q: "Differentiate f(x) = cos(3x)", a: ["-3sin(3x)", "−3sin(3x)", "-3*sin(3x)"], hint: "cos(u) → −sin(u)·u'. Here u = 3x, so u' = 3." }
      }
    };

    let currentKey = 'power';

    function normalize(s) {
      return s.toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[−–—]/g, '-')
        .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m => '⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m))
        .replace(/[₀₁₂₃₄₅₆₇₈₉]/g, m => '₀₁₂₃₄₅₆₇₈₉'.indexOf(m));
    }

    function renderTabs() {
      const bar = document.getElementById('tab-bar');
      bar.innerHTML = '';
      Object.keys(rules).forEach(key => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (key === currentKey ? ' active' : '');
        btn.textContent = rules[key].name;
        btn.onclick = () => { currentKey = key; renderTabs(); renderContent(); };
        bar.appendChild(btn);
      });
    }

    function renderContent() {
      const area = document.getElementById('content-area');
      const r = rules[currentKey];
      area.innerHTML = '';

      // Formula card
      const formulaCard = document.createElement('div');
      formulaCard.className = 'card';
      formulaCard.innerHTML = `
        <div class="card-title">Formula</div>
        <div class="formula-box">${r.formula}</div>
        <p class="description">${r.desc}</p>
      `;
      area.appendChild(formulaCard);

      // Steps card
      const stepsCard = document.createElement('div');
      stepsCard.className = 'card';
      let stepsHtml = '<div class="card-title">How to apply</div>';
      r.steps.forEach((s, i) => {
        stepsHtml += `<div class="step"><div class="step-num">${i+1}</div><div class="step-body">${s.text}</div></div>`;
      });
      stepsCard.innerHTML = stepsHtml;
      area.appendChild(stepsCard);

      // Example card
      const exCard = document.createElement('div');
      exCard.className = 'card';
      let exHtml = `<div class="card-title">Worked example</div><div class="example-func">${r.example.f}</div>`;
      exHtml += `<button class="reveal-btn" id="ex-reveal">Show step-by-step solution</button>`;
      exHtml += `<div id="ex-steps" class="hidden" style="margin-top:16px;">`;
      r.example.steps.forEach((s, i) => {
        exHtml += `<div class="step"><div class="step-num">${i+1}</div><div class="step-body">${s}</div></div>`;
      });
      exHtml += `</div>`;
      exCard.innerHTML = exHtml;
      area.appendChild(exCard);

      requestAnimationFrame(() => {
        const rev = document.getElementById('ex-reveal');
        const st = document.getElementById('ex-steps');
        if (rev && st) {
          rev.onclick = () => {
            const isHidden = st.classList.contains('hidden');
            st.classList.toggle('hidden');
            rev.textContent = isHidden ? 'Hide solution' : 'Show step-by-step solution';
          };
        }
      });

      // Practice card
      const pracCard = document.createElement('div');
      pracCard.className = 'card';
      pracCard.innerHTML = `
        <div class="card-title">Practice problem</div>
        <div class="example-func">${r.practice.q}</div>
        <input type="text" class="practice-input" id="prac-input" placeholder="Type your answer, e.g. 3x^2 + 2" autocomplete="off">
        <div class="btn-row">
          <button class="check-btn" id="prac-check">Check answer</button>
          <button class="hint-btn" id="prac-hint-btn">Need a hint?</button>
        </div>
        <div class="hint-text" id="prac-hint">${r.practice.hint}</div>
        <div class="feedback" id="prac-feedback"></div>
